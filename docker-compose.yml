version: '3.8'

services:
  api:
    build: .
    container_name: elite_music_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MASTER_ADMIN_KEY=master_live_sec_999a8b7c6d5e4f3a2b1c0d9e8f7a6b5c
      - DATABASE_URL=postgresql+asyncpg://elitemusic:secure_pg_pass_2026@postgres:5432/elitemusic_db
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_LOGGER_ENABLED=false
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: elite_postgres
    restart: always
    environment:
      POSTGRES_USER: elitemusic
      POSTGRES_PASSWORD: secure_pg_pass_2026
      POSTGRES_DB: elitemusic_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: elite_redis
    restart: always
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
