[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elitemusic"
version = "1.0.0"
description = "Official Python Client SDK for Elite Music API (Telegram Voice Chat Streaming Engine)"
readme = "README.md"
authors = [{ name = "Elite Bots Team", email = "support@elitemusic.io" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pydantic>=2.9.0"
]

[project.urls]
Homepage = "https://t.me/EliteBotsTelegram"
